services:
  pawnsystem_db_dev:
    image: postgres:16-bookworm
    container_name: pawnsystem_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: pawnsystem_db_dev
      POSTGRES_USER: pawnsystem_admin_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.dev}
      TZ: America/Regina
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./pawnsystem_db_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
