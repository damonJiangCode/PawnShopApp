services:
  pawnsystem_db_prod:
    image: postgres:16-bookworm
    container_name: pawnsystem_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: pawnsystem_db_prod
      POSTGRES_USER: pawnsystem_admin_prod
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
      TZ: America/Regina
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - ./pawnsystem_db_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
